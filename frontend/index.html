<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yahoo Finance Options Viewer</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Vega and Vega-Lite for charts -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.22.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.6.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.21.0"></script>
    
    <!-- Custom CSS with cache-busting parameter -->
    <link rel="stylesheet" href="css/styles.css?v=20250404">
</head>
<body>
    <div class="container-fluid">
        <header class="py-3 mb-4 border-bottom">
            <div class="container d-flex align-items-center justify-content-between">
                <h1 class="h4 mb-0">Yahoo Finance Options Viewer</h1>
            </div>
        </header>
        
        <div class="row">
            <!-- Options Form -->
            <div class="col-12 mb-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Options Lookup</h5>
                    </div>
                    <div class="card-body">
                        <form id="optionsForm">
                            <div class="row">
                                <div class="col-md-5">
                                    <div class="mb-3">
                                        <label for="ticker" class="form-label">Ticker Symbol</label>
                                        <div class="input-group">
                                            <input type="text" class="form-control" id="ticker" placeholder="e.g., AAPL" required>
                                            <button type="button" class="btn btn-primary" id="loadTicker">Load</button>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-5">
                                    <div class="mb-3">
                                        <label for="expiryDate" class="form-label">Expiry Date</label>
                                        <select class="form-select" id="expiryDate" disabled>
                                            <option value="">Select expiry date</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-2 d-flex align-items-end">
                                    <div class="mb-3 w-100">
                                        <button type="submit" class="btn btn-success w-100" id="viewOptionsBtn" disabled>View Options</button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            
            <!-- Options Table -->
            <div class="col-12 mb-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0" id="optionsTableTitle">Options Chain</h5>
                    </div>
                    <div class="card-body table-responsive">
                        <table class="table table-hover table-striped" id="optionsTable">
                            <thead>
                                <tr>
                                    <th>Strike</th>
                                    <th colspan="4" class="text-center call-header">Calls</th>
                                    <th colspan="4" class="text-center put-header">Puts</th>
                                </tr>
                                <tr>
                                    <th>Price</th>
                                    <!-- Call columns -->
                                    <th>Last</th>
                                    <th>Bid/Ask</th>
                                    <th>Volume</th>
                                    <th>Open Int</th>
                                    <!-- Put columns -->
                                    <th>Last</th>
                                    <th>Bid/Ask</th>
                                    <th>Volume</th>
                                    <th>Open Int</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="9" class="text-center">No options data available</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- Chart Containers -->
            <div class="col-12" id="chartContainers">
                <!-- Chart sections will be dynamically added here -->
            </div>
        </div>
    </div>
    
    <!-- Chart Section Template -->
    <template id="chartSectionTemplate">
        <div class="chart-section mb-4">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Strike Price: $<span class="strike-price"></span></h5>
                    <button type="button" class="btn-close" aria-label="Close"></button>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <!-- Chart will be rendered here -->
                    </div>
                </div>
            </div>
        </div>
    </template>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS with cache-busting parameters -->
    <script src="js/chart.js?v=20250404"></script>
    <script src="js/main.js?v=20250404"></script>
    
    <!-- Chrome cache-busting script -->
    <script>
        // Force a hard refresh of CSS only in Chrome
        window.addEventListener('load', function() {
            // Check if this is Chrome
            const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
            
            if (isChrome) {
                console.log("Chrome detected, forcing cache refresh for CSS only");
                
                // Force reload of CSS only (not JS to avoid redeclaration issues)
                const links = ['css/styles.css'];
                links.forEach(link => {
                    const oldLink = document.querySelector(`link[href^="${link}"]`);
                    if (oldLink) {
                        const newLink = document.createElement('link');
                        newLink.rel = 'stylesheet';
                        newLink.href = `${link}?v=${new Date().getTime()}`;
                        oldLink.parentNode.replaceChild(newLink, oldLink);
                    }
                });
            }
        });
    </script>
</body>
</html>
